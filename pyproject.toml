[project]
name = "sentinelvision"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "pydantic-settings",
    "python-multipart",
    "argon2-cffi",
    "pyjwt",
    "opencv-python-headless",
    "ultralytics",
    "lap",
    "celery",
    "redis",
    "boto3",
    "cryptography",
    "imageio-ffmpeg",
    "alembic",
    "psycopg[binary]",
    "av>=19.0.1",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "httpx", "ruff", "mypy", "pip-audit", "moto[server]", "httpx2"]
ml = ["mlflow", "onnx", "onnxruntime", "psutil"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.security.HTTPBearer"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["services/api/sentinel"]

