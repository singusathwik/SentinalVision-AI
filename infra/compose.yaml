name: sentinelvision
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  api:
    restart: unless-stopped
    build: {context: .., dockerfile: infra/Dockerfile.api}
    ports: ["127.0.0.1:8010:8010"]
    environment: &backend
      SENTINEL_SECRET: ${SENTINEL_SECRET:?Set SENTINEL_SECRET}
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@postgres/sentinel
      SENTINEL_DATA_DIR: /app/data
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_QUEUE: database
    volumes: ["media:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/v1/ready')"]
      interval: 10s
      retries: 10
  worker:
    restart: unless-stopped
    build: {context: .., dockerfile: infra/Dockerfile.api}
    command: ["python", "-m", "sentinel.worker"]
    environment: *backend
    volumes: ["media:/app/data"]
    depends_on:
      api: {condition: service_healthy}
  maintenance:
    restart: unless-stopped
    build: {context: .., dockerfile: infra/Dockerfile.api}
    command: ["python", "-m", "sentinel.maintenance"]
    environment: *backend
    volumes: ["media:/app/data"]
    depends_on:
      api: {condition: service_healthy}
  frontend:
    restart: unless-stopped
    build: {context: .., dockerfile: infra/Dockerfile.web}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["optional-storage"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sentinel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: ["objects:/data"]
    ports: ["127.0.0.1:9001:9001"]
volumes:
  postgres:
  media:
  objects:
